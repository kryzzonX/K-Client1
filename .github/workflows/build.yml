
name: Build K Client for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --prefix "./K LAUNCHER/k-client-launcher"

      - name: Build Windows installer
        run: npm run dist --prefix "./K LAUNCHER/k-client-launcher" -- --win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: K-Client-Windows-Installer
          path: "./K LAUNCHER/k-client-launcher/dist/*.exe"
          if-no-files-found: error
